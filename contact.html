<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6579899788641813"
     crossorigin="anonymous"></script>

<title>Contact Us - LuharSensi</title>
 
<style> 
*{box-sizing:border-box} 
body{ 
    margin:0; 
    font-family:Inter,system-ui,Arial,sans-serif; 
    background:#08090d; 
    color:#f4f6fb; 
} 
body:before{ 
    content:""; 
    position:fixed; 
    inset:0; 
    background: 
    radial-gradient(circle at 20% 10%,rgba(80,80,255,.10),transparent 30%), 
    radial-gradient(circle at 80% 90%,rgba(0,220,255,.07),transparent 30%); 
    pointer-events:none; 
} 
header{ 
    position:relative; 
    z-index:2; 
    display:flex; 
    justify-content:space-between; 
    align-items:center; 
    padding:18px 7%; 
    border-bottom:1px solid #20232c; 
    background:rgba(8,9,13,.88); 
    backdrop-filter:blur(12px); 
} 
.logo{ 
    font-size:24px; 
    font-weight:800; 
    color:#fff; 
    text-decoration:none; 
} 
.logo span{color:#6c63ff} 
nav{ 
    display:flex; 
    gap:22px; 
} 
nav a{ 
    color:#aeb4c2; 
    text-decoration:none; 
    font-size:14px; 
} 
nav a:hover{color:#fff} 
.container{ 
    position:relative; 
    z-index:1; 
    max-width:800px; 
    margin:auto; 
    padding:70px 20px 100px; 
} 
.hero{text-align:center;margin-bottom:40px} 
.hero h1{ 
    font-size:clamp(35px,6vw,55px); 
    margin:0 0 12px; 
} 
.hero p{color:#858c9c;line-height:1.7} 
.card{ 
    background:#101219; 
    border:1px solid #242833; 
    border-radius:18px; 
    padding:30px; 
    margin-bottom:20px; 
} 
.card h2{margin-top:0} 
.card p{ 
    color:#aeb4c2; 
    line-height:1.8; 
} 
.form-group{margin-bottom:18px} 
label{ 
    display:block; 
    margin-bottom:8px; 
    font-size:14px; 
    color:#d8dce6; 
} 
input,textarea{ 
    width:100%; 
    border:1px solid #292e39; 
    background:#080a0f; 
    color:#fff; 
    border-radius:10px; 
    padding:14px; 
    font:inherit; 
    outline:none; 
} 
input:focus,textarea:focus{ 
    border-color:#6c63ff; 
} 
textarea{ 
    min-height:150px; 
    resize:vertical; 
} 
button{ 
    width:100%; 
    padding:14px; 
    border:0; 
    border-radius:10px; 
    background:#6c63ff; 
    color:#fff; 
    font-weight:700; 
    font-size:15px; 
    cursor:pointer; 
    transition:.2s; 
} 
button:hover{ 
    transform:translateY(-1px); 
    filter:brightness(1.1); 
} 
.email{ 
    color:#8d86ff; 
    text-decoration:none; 
} 
footer{ 
    position:relative; 
    z-index:1; 
    border-top:1px solid #20232c; 
    padding:28px 20px; 
    text-align:center; 
    color:#777e8d; 
    font-size:13px; 
} 
footer a{ 
    color:#999fac; 
    text-decoration:none; 
    margin:0 8px; 
} 
@media(max-width:650px){ 
    header{padding:16px 20px} 
    nav{gap:12px} 
    nav a{font-size:12px} 
    .card{padding:23px} 
} 
</style> 
</head> 
 
<body> 
 
<header> 
    <a href="index.html" class="logo">Luhar<span>Sensi</span></a> 
 
    <nav> 
        <a href="index.html">Home</a> 
        <a href="generator.html">Generator</a> 
        <a href="about.html">About</a> 
        <a href="contact.html">Contact</a> 
    </nav> 
 
</header> 
 
<main class="container"> 
 
    <section class="hero"> 
        <h1>Contact Us</h1> 
        <p> 
            Have a question, suggestion, or found a problem? 
            We'd love to hear from you. 
        </p> 
    </section> 
 
    <section class="card"> 
        <h2>Send us a message</h2> 
 
        <form action="mailto:futurevision866@gmail.com" method="post" enctype="text/plain"> 
 
            <div class="form-group"> 
                <label for="name">Name</label> 
                <input 
                    type="text" 
                    id="name" 
                    name="Name" 
                    placeholder="Your name" 
                    required> 
            </div> 
 
            <div class="form-group"> 
                <label for="email">Email</label> 
                <input 
                    type="email" 
                    id="email" 
                    name="Email" 
                    placeholder="Your email" 
                    required> 
            </div> 
 
            <div class="form-group"> 
                <label for="message">Message</label> 
                <textarea 
                    id="message" 
                    name="Message" 
                    placeholder="Write your message..." 
                    required></textarea> 
            </div> 
 
            <button type="submit">Send Message</button> 
 
        </form> 
    </section> 
 
    <section class="card"> 
        <h2>Email</h2> 
        <p> 
            You can also contact us directly at: 
        </p> 
 
        <a class="email" href="mailto:futurevision866@gmail.com"> 
            futurevision866@gmail.com 
        </a> 
    </section> 
 
</main> 
 
<footer> 
    <p>© 2026 LuharSensi. All rights reserved.</p> 
    <p> 
        <a href="about.html">About</a> 
        <a href="privacy.html">Privacy Policy</a> 
        <a href="contact.html">Contact</a> 
    </p> 
</footer> 
 
</body> 
</html>
